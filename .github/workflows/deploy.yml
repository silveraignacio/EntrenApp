name: Deploy web (GitHub Pages)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust local assets
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s/style.css\"/style.css?v=$v\"/" index.html
          sed -i "s/firebase-init.js\"/firebase-init.js?v=$v\"/" index.html
          sed -i "s/data.js\"/data.js?v=$v\"/" index.html
          sed -i "s/app.js\"/app.js?v=$v\"/" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
