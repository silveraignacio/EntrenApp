<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Rutina Full Body</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>
  <header>
    <h1>🏋️ Full Body</h1>
    <div id="auth-bar" style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; font-size:12px; color:var(--dim);">
      <span id="auth-status">Invitado (sin sincronizar)</span>
      <button id="auth-btn" class="linkbtn" style="padding:2px 0;">Iniciar sesión</button>
    </div>
    <nav>
      <button class="tab active" data-view="rutina">Rutina</button>
      <button class="tab" data-view="sesiones">Sesiones</button>
      <button class="tab" data-view="analisis">Análisis</button>
      <button class="tab" data-view="historico">Histórico</button>
    </nav>
  </header>

  <div id="auth-modal" class="modal-overlay" style="display:none;">
    <div class="card modal-card">
      <h3 style="margin:0 0 12px; font-size:16px;">Iniciar sesión</h3>
      <label>Email<input type="email" id="auth-email" autocomplete="email"></label>
      <label style="margin-top:8px;">Contraseña<input type="password" id="auth-password" autocomplete="current-password"></label>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button id="auth-signin" class="primary" style="margin-top:0;">Entrar</button>
        <button id="auth-signup" class="primary" style="margin-top:0; background:var(--card2); color:var(--acc);">Crear cuenta</button>
      </div>
      <button id="auth-close" class="linkbtn" style="margin-top:10px;">Cancelar</button>
    </div>
  </div>

  <main>
    <!-- ===== RUTINA ===== -->
    <section id="view-rutina" class="view active">
      <div class="gen card">
        <div class="gen-row">
          <label>Días por semana
            <select id="days">
              <option value="2">2 días</option>
              <option value="3" selected>3 días</option>
              <option value="4">4 días</option>
              <option value="5">5 días</option>
              <option value="6">6 días</option>
            </select>
          </label>
        </div>
        <label style="flex-direction:row; align-items:center; gap:8px; cursor:pointer; margin-top:10px;">
          <input type="checkbox" id="fixed-plan">
          <span>Plan fijo Superior / Piernas (mismos ejercicios cada semana, ideal para 4 semanas)</span>
        </label>
        <button id="generate" class="primary">Generar rutina</button>
        <p class="hint" id="routine-hint">Rutina full body: cada día trabaja todo el cuerpo con ejercicios distintos. Pulsa <b>Generar</b> cuantas veces quieras para cambiarlos.</p>
      </div>
      <div id="routine"></div>
    </section>

    <!-- ===== SESIONES ===== -->
    <section id="view-sesiones" class="view">
      <div class="gen card">
        <div class="gen-row">
          <label>Fecha
            <input type="date" id="session-date">
          </label>
        </div>
        <p class="hint">Registra qué ejercicios hiciste hoy. Selecciona de la rutina o de tu histórico.</p>
      </div>
      <div id="session-form"></div>
      <button id="session-save" class="primary">Guardar sesión</button>
      <div id="sessions-list"></div>
    </section>

    <!-- ===== ANÁLISIS ===== -->
    <section id="view-analisis" class="view">
      <div id="analysis"></div>
    </section>

    <!-- ===== HISTORICO ===== -->
    <section id="view-historico" class="view">
      <div id="history"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module" src="firebase-init.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
